name: iClassicMsg
options:
  bundleIdPrefix: app.iclassicmsg
  deploymentTarget:
    iOS: "17.0"
targets:
  iClassicMsg:
    type: application
    platform: iOS
    sources:
      - path: iClassicMsgApp.swift
      - path: MessagesListView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.iclassicmsg.ios
        PRODUCT_NAME: iClassicMsg
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iClassicMsg
        INFOPLIST_KEY_UILaunchScreen_Generation: YES