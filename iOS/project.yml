name: iClassicMsg
options:
  bundleIdPrefix: app.iclassicmsg
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  iClassicMsg:
    type: application
    platform: iOS
    sources:
      - path: iClassicMsgApp.swift
      - path: MessagesListView.swift
    resources:
      - path: GoogleService-Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.iclassicmsg.ios
        PRODUCT_NAME: iClassicMsg
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iClassicMsg
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
