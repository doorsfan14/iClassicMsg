name: iOS Build

on:
  push:
    paths:
      - "iOS/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "iOS/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iOS
        run: xcodegen generate --spec project.yml

      - name: Build for iPhone (unsigned)
        working-directory: iOS
        run: |
          xcodebuild \
            -project iClassicMsg.xcodeproj \
            -scheme iClassicMsg \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        working-directory: iOS
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/iClassicMsg.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload iClassicMsg-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iClassicMsg-unsigned-ipa
          path: iOS/iClassicMsg-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Build for iOS Simulator
        working-directory: iOS
        run: |
          xcodebuild \
            -project iClassicMsg.xcodeproj \
            -scheme iClassicMsg \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
